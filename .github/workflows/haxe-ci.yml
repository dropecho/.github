name: HAXE_CI

on:
  workflow_call:
    inputs:
      haxe-versions:
        description: "JSON array of Haxe versions to test against (lix installs these)"
        required: false
        type: string
        default: '["4.3.0"]'
      os:
        description: "JSON array of operating systems to run the matrix on"
        required: false
        type: string
        default: '["ubuntu-latest"]'
      coverage-script:
        description: >-
          npm script that runs the tests with coverage and writes an lcov report. When set, a
          coverage job runs it once and posts the result on the pull request. Empty turns it off.
        required: false
        type: string
        default: ''
      coverage-lcov:
        description: Path of the lcov report the coverage script writes
        required: false
        type: string
        default: 'artifacts/coverage/lcov.info'
    secrets:
      HAXELIB_PASS:
        required: true

jobs:
  unit_tests:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        haxe: ${{ fromJSON(inputs.haxe-versions) }}
      # Let every OS/version finish, so one failure doesn't hide the others.
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell; bash is on every runner and matches the steps below.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # lix downloads Haxe itself, so no separate Haxe setup action is needed.
      - name: Install lix
        run: npm install --no-save lix
      - name: Set up Haxe via lix
        run: |
          npx lix install haxe ${{ matrix.haxe }}
          npx lix use haxe ${{ matrix.haxe }}
          npx lix download
      - name: Run Tests
        run: |
          mkdir -p artifacts
          npm run test
  # One run on the repo's own Haxe version (.haxerc) is enough for coverage. It doesn't gate the
  # release, which waits only on unit_tests.
  coverage:
    if: inputs.coverage-script != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install lix
        run: npm install --no-save lix
      - name: Set up Haxe via lix
        run: npx lix download
      - name: Run tests with coverage
        run: |
          mkdir -p artifacts
          npm run ${{ inputs.coverage-script }}
      - name: Coverage comment
        uses: dropecho/.github/.github/actions/coverage-comment@main
        with:
          lcov: ${{ inputs.coverage-lcov }}
  semantic_release:
    needs: unit_tests
    # Only release from main; pull request runs just test.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    name: semantic_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: write
      # Required for npm OIDC trusted publishing (short-lived token exchange).
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET SDK  
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # npm OIDC trusted publishing needs npm CLI >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Install lix
        run: npm install --no-save lix
      - name: Set up Haxe via lix
        run: npx lix download
      - name: Run semantic release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAXELIB_PASS: ${{ secrets.HAXELIB_PASS }}
          # No NPM_TOKEN: npm publishing uses OIDC trusted publishing.
        run: |
          npm run build
          npx semantic-release
